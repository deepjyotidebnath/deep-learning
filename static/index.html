<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Code Explainer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
    <style>
         :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #6366f1;
            --border: #334155;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        
        header {
            padding: 24px 16px 8px;
            text-align: center;
        }
        
        header h1 {
            margin: 0;
            font-size: 1.8rem;
        }
        
        header p {
            margin: 6px 0 0;
            color: var(--muted);
        }
        
        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px;
            display: grid;
            gap: 16px;
            grid-template-columns: 1fr 1fr;
        }
        
        @media (max-width:850px) {
            main {
                grid-template-columns: 1fr;
            }
        }
        
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }
        
        .row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }
        
        select,
        button,
        textarea {
            font: inherit;
            color: var(--text);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
        }
        
        select {
            flex: 1;
        }
        
        textarea {
            width: 100%;
            height: 380px;
            resize: vertical;
            font-family: ui-monospace, Consolas, monospace;
            font-size: .9rem;
        }
        
        button {
            width: 100%;
            background: var(--accent);
            border: none;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }
        
        button:disabled {
            opacity: .6;
            cursor: wait;
        }
        
        #output {
            min-height: 380px;
            overflow: auto;
            max-height: 70vh;
            line-height: 1.6;
        }
        
        #output table {
            border-collapse: collapse;
            width: 100%;
            margin: 8px 0;
        }
        
        #output th,
        #output td {
            border: 1px solid var(--border);
            padding: 6px 8px;
            text-align: left;
        }
        
        #output pre {
            background: var(--bg);
            padding: 12px;
            border-radius: 8px;
            overflow: auto;
        }
        
        #output code {
            font-family: ui-monospace, Consolas, monospace;
        }
        
        .placeholder {
            color: var(--muted);
        }
        
        .error {
            color: #f87171;
        }
        
        .meta {
            color: var(--muted);
            font-size: .8rem;
            margin-top: 8px;
        }
    </style>
</head>

<body>
    <header>
        <h1>AI Code Explainer</h1>
        <p>Paste code, pick your level, get a clear explanation.</p>
    </header>
    <main>
        <section class="card">
            <div class="row">
                <select id="language">
        <option>python</option><option>javascript</option><option>typescript</option>
        <option>java</option><option>c</option><option>cpp</option><option>go</option>
        <option>rust</option><option>sql</option><option>html</option>
      </select>
                <select id="level">
        <option value="beginner">Beginner</option>
        <option value="intermediate">Intermediate</option>
        <option value="advanced">Advanced</option>
      </select>
            </div>
            <textarea id="code" placeholder="Paste your code here..." spellcheck="false"></textarea>
            <button id="btn">Explain Code</button>
        </section>
        <section class="card">
            <div id="output">
                <p class="placeholder">The explanation will appear here.</p>
            </div>
            <div id="meta" class="meta"></div>
        </section>
    </main>
    <script>
        const btn = document.getElementById("btn");
        const out = document.getElementById("output");
        const meta = document.getElementById("meta");

        btn.addEventListener("click", async() => {
            const code = document.getElementById("code").value.trim();
            if (!code) {
                out.innerHTML = '<p class="error">Please paste some code first.</p>';
                return;
            }
            btn.disabled = true;
            btn.textContent = "Explaining...";
            out.innerHTML = '<p class="placeholder">Thinking...</p>';
            meta.textContent = "";
            try {
                const res = await fetch("/explain", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        code,
                        language: document.getElementById("language").value,
                        level: document.getElementById("level").value,
                    }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Request failed");
                out.innerHTML = DOMPurify.sanitize(marked.parse(data.explanation));
                meta.textContent = `Model: ${data.model}`;
            } catch (err) {
                out.innerHTML = `<p class="error">${err.message}</p>`;
            } finally {
                btn.disabled = false;
                btn.textContent = "Explain Code";
            }
        });
    </script>
</body>

</html>
